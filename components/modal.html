<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <button class="modal-close" id="btn-modal-close" aria-label="Close modal">&#x2715;</button>
    <h3 id="modal-title">Request a Dish</h3>
    <p class="modal-sub">Tell us what you'd like and we'll make it happen!</p>
    <div class="modal-form">
      <div class="form-group">
        <label for="modal-name">Your Name</label>
        <input type="text" id="modal-name" placeholder="e.g. Sagar Goel" />
      </div>
      <div class="form-group">
        <label for="modal-dish">Dish Name</label>
        <input type="text" id="modal-dish" placeholder="e.g. Margherita Pizza" />
      </div>
      <div class="form-group">
        <label for="modal-phone">Phone Number</label>
        <input type="tel" id="modal-phone" placeholder="e.g. 6060704567" />
      </div>
      <div class="form-group">
        <label for="modal-note">Special Instructions</label>
        <textarea id="modal-note" rows="3" placeholder="Less spicy, no onions..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-modal-cancel">Cancel</button>
        <button type="button" class="btn-submit-modal" id="btn-modal-submit">Submit Request</button>
      </div>
    </div>
  </div>
</div>
