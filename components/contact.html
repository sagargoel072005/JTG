<section class="contact-section" id="contact">
  <div class="container contact-inner">

    <div class="contact-form-wrap">
      <h2>Do you have a question<br>or want to become a seller?</h2>
      <p>Fill this form and our manager will contact you next 48 hours.</p>

      <div class="contact-form">
        <div class="form-row">
          <div class="form-group">
            <input type="text" placeholder="Your Name" aria-label="Your Name" />
          </div>
          <div class="form-group">
            <input type="email" placeholder="Your e-mail" aria-label="Your Email" />
          </div>
        </div>
        <div class="form-group">
          <textarea rows="5" placeholder="Your message" aria-label="Your message"></textarea>
        </div>
        <button type="button" class="btn-submit" id="btn-submit">Submit</button>
      </div>
    </div>

    <div class="contact-illustration" aria-hidden="true">
      <img src="../assets/images/food-delivery.png" alt="Delivery illustration" />
    </div>

  </div>
</section>
